<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      .tp {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--homey-su-1);
      }

      .tp-label {
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tp-field {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 52px;
        border-radius: var(--homey-border-radius-default);
        background-color: var(--homey-color-mono-050);
        border: var(--homey-line-light);
        transition: background-color 150ms ease, opacity 150ms ease;
      }

      .tp-field:active {
        background-color: var(--homey-color-mono-100);
      }

      .tp.is-disabled .tp-field {
        opacity: 0.4;
        pointer-events: none;
      }

      .tp-field input {
        font-family: inherit;
        font-size: var(--homey-font-size-xxlarge);
        line-height: var(--homey-line-height-xxlarge);
        font-weight: var(--homey-font-weight-bold);
        font-variant-numeric: tabular-nums;
        color: var(--homey-text-color);
        background: transparent;
        border: none;
        outline: none;
        padding: 0;
        text-align: center;
      }

      /* Keep the native picker button, but make it blend in. */
      .tp-field input::-webkit-calendar-picker-indicator {
        opacity: 0.35;
        cursor: pointer;
      }

      body { position: relative; }

      .tp-power {
        position: absolute;
        top: var(--homey-su-2);
        right: var(--homey-su-2);
        width: 30px;
        height: 30px;
        padding: 0;
        border: none;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background-color: var(--homey-color-mono-100);
        color: var(--homey-text-color-light);
        -webkit-tap-highlight-color: transparent;
        transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
      }

      .tp-power svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }

      .tp-power.is-on {
        background-color: var(--homey-color-blue, #2674f0);
        color: var(--homey-text-color-white, #fff);
      }

      .tp-power[disabled] { opacity: 0.35; pointer-events: none; }

      .tp-days {
        display: flex;
        justify-content: center;
        gap: var(--homey-su-1);
      }

      .tp-day {
        min-width: 28px;
        padding: 1px 4px;
        text-align: center;
        border-radius: var(--homey-border-radius-small);
        font-size: var(--homey-font-size-small);
        line-height: var(--homey-line-height-small);
        color: var(--homey-text-color-light);
        background: transparent;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 120ms ease, color 120ms ease;
      }

      .tp-day.is-on {
        background-color: var(--homey-color-mono-100);
        color: var(--homey-text-color);
        font-weight: var(--homey-font-weight-medium);
      }

      .tp-days.is-disabled { pointer-events: none; opacity: 0.4; }

      .tp-status {
        text-align: center;
        min-height: var(--homey-line-height-small);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tp-modes {
        display: flex;
        justify-content: center;
        gap: var(--homey-su-1);
      }

      .tp-mode {
        width: 36px;
        height: 26px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: var(--homey-border-radius-small);
        background: transparent;
        color: var(--homey-text-color-light);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 120ms ease, color 120ms ease;
      }

      .tp-mode svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tp-mode.is-on {
        background-color: var(--homey-color-mono-100);
        color: var(--homey-text-color);
      }

      .tp.is-disabled .tp-modes { opacity: 0.4; pointer-events: none; }

      /* Same box as the time input, but showing the time the sun event resolves to. */
      .tp-sun {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 0 var(--homey-su-2);
        box-sizing: border-box;
      }

      .tp-step {
        width: 32px;
        height: 32px;
        flex: none;
        padding: 0;
        border: none;
        border-radius: 50%;
        background-color: var(--homey-color-mono-100);
        color: var(--homey-text-color);
        font-family: inherit;
        font-size: var(--homey-font-size-default);
        line-height: 1;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .tp-step:active { background-color: var(--homey-color-mono-200); }

      .tp-resolved {
        font-size: var(--homey-font-size-xxlarge);
        line-height: var(--homey-line-height-xxlarge);
        font-weight: var(--homey-font-weight-bold);
        font-variant-numeric: tabular-nums;
      }

      .tp-caption {
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      [hidden] { display: none !important; }

      .tp-status.is-success { color: var(--homey-text-color-success); }
      .tp-status.is-warning { color: var(--homey-text-color-warning); }
      .tp-status.is-error { color: var(--homey-text-color-danger); }
    </style>
  </head>

  <body class="homey-widget">
    <div class="tp" id="root">
      <button class="tp-power" id="power" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5v8" /><path d="M7.4 6.6a6.5 6.5 0 1 0 9.2 0" /></svg></button>
      <div class="tp-label homey-text-small-light" id="label">&nbsp;</div>
      <div class="tp-modes" id="modes">
        <button class="tp-mode" type="button" data-mode="absolute"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3.2 2" /></svg></button>
        <button class="tp-mode" type="button" data-mode="sunrise"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 19h18" /><path d="M7.5 15.5a4.5 4.5 0 0 1 9 0" /><path d="M12 3.5v5.5" /><path d="m9.2 6.3 2.8-2.8 2.8 2.8" /></svg></button>
        <button class="tp-mode" type="button" data-mode="sunset"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 19h18" /><path d="M7.5 15.5a4.5 4.5 0 0 1 9 0" /><path d="M12 3.5v5.5" /><path d="m9.2 6.2 2.8 2.8 2.8-2.8" /></svg></button>
      </div>
      <div class="tp-field" id="field">
        <input type="time" id="time" step="60" />
        <div class="tp-sun" id="sun" hidden>
          <button class="tp-step" type="button" data-delta="-1">&minus;</button>
          <span class="tp-resolved" id="resolved">--:--</span>
          <button class="tp-step" type="button" data-delta="1">+</button>
        </div>
      </div>
      <div class="tp-caption homey-text-small-light" id="caption" hidden>&nbsp;</div>
      <div class="tp-days" id="days"></div>
      <div class="tp-status homey-text-small-light" id="status">&nbsp;</div>
    </div>

    <script type="text/javascript">
      const TIME_PATTERN = /^([01]\d|2[0-3]):([0-5]\d)$/;
      const SAVE_DEBOUNCE = 500;
      /** One tap of the stepper, and the furthest a time may sit from its sun event. */
      const OFFSET_STEP = 5;
      const OFFSET_LIMIT = 720;

      const root = document.getElementById('root');
      const label = document.getElementById('label');
      const field = document.getElementById('field');
      const input = document.getElementById('time');
      const status = document.getElementById('status');
      const modesEl = document.getElementById('modes');
      const sunEl = document.getElementById('sun');
      const resolvedEl = document.getElementById('resolved');
      const captionEl = document.getElementById('caption');

      let homey = null;
      let device = null;
      let statusTimeout = null;
      let saveTimeout = null;
      let savesInFlight = 0;
      let saveSeq = 0;
      /** What the slot is set to, and the time that comes to today. */
      let spec = { mode: 'absolute', time: null, offset: 0 };
      let resolved = null;

      function setStatus(text, state) {
        clearTimeout(statusTimeout);
        status.textContent = text || ' ';
        status.className = `tp-status homey-text-small-light${state ? ` is-${state}` : ''}`;
      }

      function flashStatus(text, state, duration = 2000) {
        setStatus(text, state);
        statusTimeout = setTimeout(showIdleStatus, duration);
      }

      function setDisabled(disabled) {
        root.classList.toggle('is-disabled', disabled);
        input.disabled = disabled;
        for (const el of modesEl.children) el.disabled = disabled;
      }

      /** "Sunset −30 min", or just the event when it is followed exactly. */
      function describeSpec() {
        const event = homey.__(`common.${spec.mode}`);
        if (!spec.offset) return event;

        return homey.__(spec.offset > 0 ? 'common.offsetAfter' : 'common.offsetBefore',
          { event, minutes: Math.abs(spec.offset) });
      }

      function renderMode() {
        const followsSun = spec.mode !== 'absolute';

        for (const el of modesEl.children) {
          el.classList.toggle('is-on', el.dataset.mode === spec.mode);
          el.title = homey.__(`common.${el.dataset.mode === 'absolute' ? 'fixedTime' : el.dataset.mode}`);
        }

        input.hidden = followsSun;
        sunEl.hidden = !followsSun;
        captionEl.hidden = !followsSun;

        if (followsSun) {
          resolvedEl.textContent = resolved || '--:--';
          captionEl.textContent = describeSpec();
        }

        syncHeight();
      }

      function pickMode(mode) {
        if (mode === spec.mode) return;

        spec = Object.assign({}, spec, { mode });
        // The fixed time is still stored, so switching back needs to send nothing but
        // the mode; the resolved time arrives with the response.
        renderMode();
        setStatus(homey.__('common.saving'));
        clearTimeout(saveTimeout);
        saveTimeout = null;
        save({ mode });
      }

      function stepOffset(delta) {
        const next = Math.max(-OFFSET_LIMIT, Math.min(OFFSET_LIMIT, spec.offset + delta));
        if (next === spec.offset) return;

        // The resolved time tracks the offset one minute for one, so move it now
        // instead of waiting for the round trip.
        resolved = shiftLocal(resolved, next - spec.offset);
        spec = Object.assign({}, spec, { offset: next });
        renderMode();

        setStatus(homey.__('common.saving'));
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          saveTimeout = null;
          save({ offset: spec.offset });
        }, SAVE_DEBOUNCE);
      }

      function shiftLocal(time, delta) {
        if (!TIME_PATTERN.test(time)) return time;

        const total = (Number(time.slice(0, 2)) * 60 + Number(time.slice(3)) + delta + 1440) % 1440;
        return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
      }

      function describeError(err) {
        switch (err && err.message) {
          case 'unknown_device':
            return homey.__('common.errUnknownDevice');
          case 'invalid_time':
            return homey.__('common.errInvalidTime');
          default:
            console.error('Time Picker:', err);
            return homey.__('common.errGeneric');
        }
      }

      function isSafeToReplaceValue() {
        return saveTimeout === null
          && savesInFlight === 0
          && document.activeElement !== input;
      }

      function apply(state) {
        label.textContent = homey.getSettings().title || state.name;
        spec = (state.specs && state.specs.time) || spec;
        resolved = state.times.time;
        input.value = TIME_PATTERN.test(spec.time) ? spec.time : '';
        enabledState = state.enabled !== false;
        renderPower();
        renderMode();
        applyDays(state.days);
      }

      function showIdleStatus() {
        if (enabledState) return setStatus(null);
        setStatus(homey.__('common.paused'), 'warning');
      }

      async function refresh() {
        if (!isSafeToReplaceValue()) return;

        try {
          apply(await homey.api('GET', `/state?id=${encodeURIComponent(device.id)}`));
          setDisabled(false);
          showIdleStatus();
        } catch (err) {
          setDisabled(true);
          setStatus(describeError(err), 'error');
        }
      }

      function scheduleSave() {
        const value = input.value.slice(0, 5);
        if (!TIME_PATTERN.test(value)) return;

        setStatus(homey.__('common.saving'));
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          saveTimeout = null;
          save({ mode: 'absolute', time: value });
        }, SAVE_DEBOUNCE);
      }

      async function save(changes) {
        const seq = ++saveSeq;
        savesInFlight++;

        try {
          // The app owns the device, so the write is immediate - nothing to confirm.
          const state = await homey.api('PUT', '/spec', { id: device.id, slot: 'time', changes });
          if (seq !== saveSeq) return;

          spec = (state.specs && state.specs.time) || spec;
          resolved = state.times.time;
          renderMode();
          flashStatus(homey.__('timePicker.saved', { time: resolved || '--:--' }), 'success');
          try {
            homey.hapticFeedback();
          } catch (err) { /* not available on every platform */ }
        } catch (err) {
          if (seq !== saveSeq) return;
          setStatus(describeError(err), 'error');
        } finally {
          savesInFlight--;
        }
      }

      // Monday-first display order; the settings ids are Sunday-first to match Date.getUTCDay().
      const WEEK = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      const daysEl = document.getElementById('days');
      let enabledDays = WEEK.slice();

      function renderDays() {
        daysEl.replaceChildren(...WEEK.map(day => {
          const el = document.createElement('div');
          el.className = `tp-day${enabledDays.includes(day) ? ' is-on' : ''}`;
          el.textContent = homey.__(`weekday.${day}`);
          el.addEventListener('click', () => toggleDay(day));
          return el;
        }));
        syncHeight();
      }

      async function toggleDay(day) {
        const next = enabledDays.includes(day)
          ? enabledDays.filter(d => d !== day)
          : WEEK.filter(d => enabledDays.includes(d) || d === day);

        // Every day and all seven ticked are the same schedule, so "none" has no meaning
        // here - refuse the tap rather than silently turning the device off.
        if (next.length === 0) {
          flashStatus(homey.__('common.errNoDays'), 'error');
          return;
        }

        const previous = enabledDays;
        enabledDays = next;
        renderDays();

        try {
          await homey.api('PUT', '/days', { id: device.id, days: next });
          flashStatus(next.length === WEEK.length
            ? homey.__('common.everyDay')
            : next.map(d => homey.__(`weekday.${d}`)).join(' '), 'success');
        } catch (err) {
          enabledDays = previous;
          renderDays();
          setStatus(describeError(err), 'error');
        }
      }

      /** An empty setting means every day, which is the same schedule as all seven. */
      function applyDays(days) {
        enabledDays = !days || days.length === 0 ? WEEK.slice() : WEEK.filter(d => days.includes(d));
        renderDays();
      }

      function applyColorScheme() {
        const bg = getComputedStyle(document.body).backgroundColor;
        const rgb = (bg.match(/\d+(\.\d+)?/g) || []).slice(0, 3).map(Number);
        if (rgb.length < 3) return;

        const luminance = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
        document.documentElement.style.colorScheme = luminance < 0.5 ? 'dark' : 'light';
      }

      const powerEl = document.getElementById('power');
      let enabledState = true;

      function renderPower() {
        powerEl.classList.toggle('is-on', enabledState);
        powerEl.title = homey.__(enabledState ? 'common.pause' : 'common.resume');
        powerEl.setAttribute('aria-pressed', String(enabledState));
      }

      async function togglePower() {
        const next = !enabledState;
        enabledState = next;
        renderPower();
        showIdleStatus();

        try {
          await homey.api('PUT', '/enabled', { id: device.id, enabled: next });
        } catch (err) {
          enabledState = !next;
          renderPower();
          setStatus(describeError(err), 'error');
        }
      }

      /**
       * Re-report the height once content that changes it has rendered. The day strip
       * arrives with the first API response, well after ready() would have measured.
       */
      let reportedHeight = null;
      function syncHeight() {
        const measured = document.body.scrollHeight;
        if (measured <= 40 || measured === reportedHeight) return;

        reportedHeight = measured;
        if (typeof homey.setHeight === 'function') homey.setHeight(measured);
      }

      function ready() {
        const measured = document.body.scrollHeight;
        reportedHeight = measured > 40 ? measured : null;
        homey.ready(reportedHeight ? { height: reportedHeight } : undefined);
      }

      function onHomeyReady(Homey) {
        homey = Homey;
        applyColorScheme();

        const settings = Homey.getSettings();
        device = settings.device || null;

        if (device === null) {
          label.textContent = settings.title || Homey.__('timePicker.name');
          setDisabled(true);
          renderDays();
          renderPower();
          renderMode();
          daysEl.classList.add('is-disabled');
          powerEl.disabled = true;
          setStatus(Homey.__('timePicker.pickDevice'), 'error');
          ready();
          return;
        }

        label.textContent = settings.title || device.name || ' ';

        field.addEventListener('click', event => {
          if (spec.mode !== 'absolute' || event.target === input || input.disabled) return;
          input.focus();
          if (typeof input.showPicker === 'function') {
            try {
              input.showPicker();
            } catch (err) { /* needs a user gesture on some platforms */ }
          }
        });

        input.addEventListener('change', scheduleSave);
        powerEl.addEventListener('click', togglePower);
        modesEl.addEventListener('click', event => {
          const button = event.target.closest('.tp-mode');
          if (button) pickMode(button.dataset.mode);
        });
        sunEl.addEventListener('click', event => {
          const button = event.target.closest('.tp-step');
          if (button) stepOffset(Number(button.dataset.delta) * OFFSET_STEP);
        });

        // Render before measuring, or the day strip is missing from the reported height.
        renderPower();
        renderDays();
        renderMode();

        Homey.on('schedule', state => {
          if (!state || !device || state.id !== device.id) return;
          if (!isSafeToReplaceValue()) return;
          apply(state);
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) refresh();
        });

        ready();
        refresh();
      }
    </script>
  </body>
</html>
